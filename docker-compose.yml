# Ambiente local completo: API + banco Oracle
# Uso:  cp .env.example .env  &&  docker compose up -d --build

services:
  oracle:
    # Oracle Database 23ai Free — imagem multi-arquitetura (Intel e Apple Silicon)
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: eco-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - eco-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: local-compose
    image: eco-compliance-api:local
    container_name: eco-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Oracle: "Data Source=oracle:1521/FREEPDB1;User Id=${ORACLE_APP_USER};Password=${ORACLE_APP_PASSWORD};"
      Database__ApplyMigrations: "true"
      Auth__Username: ${AUTH_USERNAME}
      Auth__Password: ${AUTH_PASSWORD}
      Auth__JwtKey: ${AUTH_JWT_KEY}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - eco-net
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle-data:

networks:
  eco-net:
    driver: bridge
